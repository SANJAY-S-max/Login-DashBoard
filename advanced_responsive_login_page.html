<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #000, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #111;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      transition: 0.3s;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #000;
      color: #fff;
      transition: 0.3s;
    }

    input:focus {
      border-color: #fff;
      box-shadow: 0 0 8px #fff;
      outline: none;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:active {
      transform: scale(0.95);
    }

    .footer {
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }

    /* Tablet */
    @media (max-width: 768px) {
      .container {
        padding: 25px;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .container {
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }

      input, button {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Login</h2>

  <form id="loginForm">
    <div class="input-group">
      <input type="text" id="username" placeholder="Username">
      <div class="error" id="userError">Invalid username</div>
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
      <div class="error" id="passError">Invalid password</div>
    </div>

    <button type="submit">Login</button>
  </form>

  <div class="footer">Don't have an account? Sign up</div>
</div>

<script>
  const form = document.getElementById("loginForm");
  const username = document.getElementById("username");
  const password = document.getElementById("password");

  const userError = document.getElementById("userError");
  const passError = document.getElementById("passError");

  form.addEventListener("submit", function(e) {
    e.preventDefault(); // prevent page reload

    let isValid = true;

    // Username regex: 3-10 chars, letters only
    const userRegex = /^[A-Za-z]{3,10}$/;

    // Password regex: min 6 chars, 1 number, 1 special char
    const passRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{6,}$/;

    // Username validation
    if (!userRegex.test(username.value)) {
      userError.style.display = "block";
      isValid = false;
    } else {
      userError.style.display = "none";
    }

    // Password validation
    if (!passRegex.test(password.value)) {
      passError.style.display = "block";
      isValid = false;
    } else {
      passError.style.display = "none";
    }

    if (isValid) {
      alert("Login Successful 🚀");
    }
  });
</script>

</body>
</html>
